[project]
name = "legalaid"
version = "0.1.0"
description = "LegalAId - AI-assisted Indian legal research and drafting workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.120.4",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.4",
    "pydantic-settings==2.13.0",
    "sqlalchemy==2.0.44",
    "psycopg[binary]>=3.2.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "pymupdf==1.26.5",
    "python-docx==1.2.0",
    "faiss-cpu==1.13.2",
    "numpy==2.4.2",
    "pyyaml==6.0.3",
    "sse-starlette==3.0.2",
    "structlog==25.5.0",
    "fastmcp>=0.4.0",
    "crewai>=0.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock>=3.14.0",
    "mypy==1.19.0",
    "ruff==0.15.4",
]
cloud = [
    "vllm>=0.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
